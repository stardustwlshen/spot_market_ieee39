# 市场规则参数：一套自有统一规则 MKT（参考四川、甘肃现行规则取值，不再分省口径）。
# 每项注明参考来源：
#   川V4.0   = 《四川电力现货市场交易实施细则（V4.0）》2025-11（nxepta.com）
#   川结算   = 《四川电力市场结算细则 V1.0》
#   甘V3.2   = 《甘肃电力现货市场管理实施细则（V3.2）》/《运营实施细则》（gxt.gansu.gov.cn）
#   甘工作方案 = 《甘肃电力现货市场结算运行工作方案》
#   基本规则 = 《电力现货市场基本规则（试行）》发改能源规〔2023〕1217号
# 未查到原文数值、由本项目设定的均标“假设值”。所有参数可在此修改。
MKT:
  startup_cost_mode: uniform_per_unit  # 每台机组单一启动费；不同机组保持差异；旧缺键配置沿用分状态模式
  name: 自有统一现货市场规则（参考川、甘）
  pricing: LMP                       # 节点边际电价（甘V3.2 发电侧节点电价；川为系统电价，本项目统一用 LMP）
  price_limits:                      # 元/MWh
    bid_min: -50                     # 川2026总体方案 五（二）2：申报价格下限-50元/MWh（与clear_min统一）
    bid_max: 800                     # 本研究假设上限；不是广东周度煤电申报上限，不由出清限价推导
    clear_min: -50                   # 出清/结算下限=报价下限-50（川2026总体方案 五（二）2：申报与出清价格下限-50元/MWh；甘肃40未采用）
    clear_max: 800                   # 川V4.0 附件3
  segments:
    min: 3                           # 假设值：川 5–10 段，甘 1–10 段，取 3
    max: 10                          # 两省一致：最多 10 段
    storage_min: 1
    storage_max: 5                   # 川V4.0 储能 1–5 段（甘 1–10）
  price_strict_increasing: true      # 川V4.0：各段价格严格递增（甘为单调非减）
  price_step: 10                     # 甘V3.2：价格步长 10 元/MWh
  min_seg_frac: 0.10                 # 甘V3.2：每段 ≥ 装机 10%（川 A1=5%，储能 10%）
  max_adjacent_step: 150             # 川V4.0 β2=150：相邻段价差上限（煤电首段→第 2 段除外）
  bid_rules:
    # 广东2025细则结构参考，仅作用于火电市场段；原0~Pmin是内部模型基座，不计市场段数。
    # https://www.gzpec.cn/law/jygz/202505/P020250516601779253100.pdf pp.13–19
    # 最多10市场段、连续到额定出力、非递减；宽度>=max(5%可调范围,1MW)，可调范围<1MW取实际。
    # 整条内部曲线（含基座）也须非递减且在报价上下限内，防止独立分段变量错误排序。
    profile: gd_reference_thermal
    default: {}                     # 可覆写独立报价规则，不读取 clear_min/clear_max
    by_type:
      wind: {require_capacity_coverage: true}  # 新能源报价曲线覆盖0~额定容量
      pv: {require_capacity_coverage: true}    # 可用预测量仍另行限制实际出力
  coal_first_segment: pmin           # 两省一致：煤电首段为 0~最小技术出力
  storage_dis_gt_ch: error           # 川V4.0：放电最低价须高于充电最高价（不满足即报错）
  startup_states: {hot: 8, warm: 72} # 研究三态：停机<8h热、[8,72)h温、>=72h冷；甘V3.2 另分极热态 1h，此处不分
  demand_bid: false                  # 第一阶段负荷固定（两省用户侧报量不报价/暂不定价）
  tie_mode: fixed                    # 区外来电按联络线计划固定（川V4.0 7.5.2 / 甘V3.2 联络线终计划作边界）
  reserve:                           # 当前上备用固定总量；旧公式保留为可选研究设定
    up_requirement_mode: fixed      # 用户设定/假设（2026-11-08）：不是省级规则或N-1安全认证
    fixed_up_mw: 400.0              # 每时段总上备用MW，不再叠加比例或事故项
    rho_L: 0.03                      # 假设值（DL/T 5429-2009 负荷备用 2%–5%）
    rho_RE: 0.10                     # 假设值（两省规则未给数值）
    rho_L_dn: 0.03                   # 假设值
    rho_RE_dn: 0.0                   # 假设值
    include_ctg: true                # 甘V3.2：正备用 ≥ max(单一交流元件故障最大功率缺额, 最大单机)
    mu_RE: 0.0                       # 风光计入正备用的置信因子（甘V3.2 有该项但未给数值，取 0，假设值）
    storage_reserve: true            # 当前研究：电池与发电工况抽蓄提供上备用
    down_enabled: false              # 研究设定（与基本规则第四十六条“设正负备用”不同）：当前只采购上备用；下备用需求、供给及缺额固定0
    T_dur_h: 0.25                    # 假设值（研究设定）：备用能量按时段末库存E[t]/Vu[t]（第二轮F项）折算15min（0.25h）持续；不保证基准加备用全程持续，不是响应速度认证
    # 常规水电上备用另按末库容减物理下界的可用水量筛查同一T_dur_h；不预支未来来水/已弃水。
    providers: [coal, gas_ccgt, gas_gt, hydro]
  # 假设值（研究设定，Wls指定）：线路10000 < 备用1e5 < 平衡1e6，不宣称任何省现行出清规则。
  penalties: {balance: 1.0e+6, line: 10000, reserve: 1.0e+5}
  # 假设值（研究设定，Wls指定）：辅助算价独立罚因子与±3%调度带，单位元/MWh；与正式调度 penalties 分开。
  # 独立辅助算价；正式量/状态仍来自调度SCED，辅助量不执行。
  auxiliary_pricing:
    enabled: true
    penalties_yuan_per_mwh: {balance: 10000, line: 1000, reserve: 2500}
    dispatch_band: {relative_to_dispatch: 0.03, minimum_mw: 1.0}
    # 第二轮E项：辅助克隆保留全部物理、价值项、偏差带与锚点（rt_tracking_policy默认preserve，不再移除）
  # ---- 滚动方式（甘肃模式）：不设独立日内市场；煤电/CCGT 启停在日前确定（甘V3.2 第十八条），
  #      实时每 15 min 滚动出清未来 2 h（甘V3.2 第六十三条），只执行首时段。
  storage_end_soc:                   # 储能期末 SOC
    da: declared                     # 日前：储能申报运行日末期望 SOC → 硬约束（川V4.0 7.7.4、附件8 式(20)）；未申报 → E_T = E_0（假设值，第二轮B项）
  intraday:                          # 独立日内滚动（川V4.0 8.1 事件触发式）；统一规则 MKT 默认关闭，代码保留
    enabled: false                   # 甘肃模式不设独立日内市场；--intraday 可打开做对比
    interval_h: 1                    # 假设值（仅 enabled 时）：川V4.0 8.1 为“边界变化时触发”，未规定固定周期
    window: day_end                  # 川V4.0 8.1、8.3.1：运行日剩余时段
    granularity_min: 15              # 川V4.0 8.2.5：96 点
    # 启停分级（第三轮，可按机组类型改）：lock_types = 锁定日前（煤电启动时间长；CCGT 研究设定也锁日前，假设值）
    #   free_types 中的火电类型 = 日内按最新预测调整启停，实时继承（realtime.intraday_commit_rt）
    lock_types: [coal, gas_ccgt]     # 川V4.0 8.2.4；基本规则第五十四条：日内滚动优化快速启停资源
    free_types: [gas_gt, hydro, storage]   # 日内（仅 enabled）：水电期末库容硬约束、储能日末 SOC 按实时锚点规则
    lead_issue_periods: 1            # 假设值
    mip_rel_gap: 0.005               # 假设值（求解参数）
    time_limit_s: 60
  realtime:
    # 第三轮：日内→实时交接（仅 intraday.enabled 时起作用；当天尚无日内结果的时段自动回退日前）
    handoff_source: intraday         # intraday（默认）| day_ahead：价值法参考轨迹 X^ref（偏差带中心）、窗口末价值 v、水电稳定区台数、快速机组启停的来源
    handoff: {commitment: true, storage: true, pumped: true, hydro: true}   # 状态资源false取日前；commitment=false保留GT实时自由（不称继承日前）
    intraday_commit_rt: inherit      # inherit：实时锁定日内决定的 GT 启停（日内看到剩余全天、计启停成本与最小启停时间，2h 窗口短视）
                                     # free：实时 2h 窗口内可再调 GT（旧做法，研究设定）
    # 旧水电软跟踪（仅 hydro: window_end_da 时生效）：罚1000元/可放电MWh，假设值；默认价值法不用
    tracking_policy: {mode: soft_deliverable_energy, penalty_yuan_per_discharge_mwh: 1000}
    value_method:                    # 第二轮C/D项：窗口末状态价值法（默认）
      # 价值v取选定DA/ID正式SCED库存对偶，保留正负号；非日末窗口末加−v·X，日末无额外跨日价值
      hydro_lookahead: reference_continuation # 显式水电参考续程软偏好，历史缺键=off
      terminal_policy: {mode: soft, penalty_yuan_per_discharge_mwh: 1000} # 研究假设：仅RT日末软目标，统一可放电MWh；hard保留历史对照
      band_fraction: 0.02            # 假设值：电池δ0=2%×额定ecap，抽蓄=2%×可调库容；soft不再强制日末回归包络
      hydro_band_fraction: 0.02      # 假设值：水电δ0 = 2%×调节库容(vmax−vmin)
      fallback_penalty: 1.0e+5       # 假设值：仅明确SCUC/正式SCED硬不可行才软化，硬/软/算价共用预算；元/MWh或元/万m³
    interval_min: 15                 # 川V4.0 9.1、甘V3.2 第六十三条：15 分钟
    lookahead_h: 2                   # 甘V3.2 第六十三条：滚动出清未来 15 min–2 h（川V4.0 写“未来 M 小时”，M 查不到）
    boundary_lead_min: 30            # 甘V3.2 第六十三条时序：T−30 读取边界（状态、超短期预测），T−30~T−15 求解，T−15 下发
    binding_periods: 1               # 只执行首时段 T~T+15
    first_period_actual: true        # 假设做法：首时段负荷/风光用实际值（T−30 超短期预测残差由 AGC 承担，不建模）
    lock_types: [coal, gas_ccgt]     # 启停沿用日前（甘V3.2 第十八条：煤电启停日前确定）
    free_types: [gas_gt]             # 无日内交接或显式free时GT在实时MIP内决策；有日内默认继承其启停（研究设定）
    hydro: value                     # 默认价值法：固定选定DA/ID参考台数，实际V起步，Ph可调；日末软目标仅罚低于v_end（物理vmin仍硬），无额外残值
                                     # 研究设定：水电Ph在价值法下可调（替代原罚1000软跟踪）；旧legacy/v2按季节常数来水、无预测误差；显式causal_physical_v3按发布预测取分时天然来水，执行首段已知均值是另列研究假设
                                     # 可选 window_end_da（旧：窗口末V软跟踪DA，罚tracking_policy）/ fixed_da（固定DA出力）/ sced
                                     # 甘肃2026 V3.2第64(四)/73允许经安全校核的自调度申报结合最新能力参与实时优化
    storage:
      mode: value                    # 默认价值法（充放0-1互斥仍在窗口MIP内）；可选 sced_anchor（按anchor锚定DA SOC）/ fixed_da（执行日前曲线，模式A）
      anchor: two_hour_eq            # 仅 mode=sced_anchor：two_hour_eq（02/04/…/24点硬等于DA，不可行时软化回退）/ hourly_eq（B2）/ window_end_pct（B1）
                                     # 可选 window_end_pct（模式 B1）：甘V3.2 运营细则附录5 第9项，窗口末 (1−x)E_DA ≤ E_RT ≤ (1+x)E_DA（同时满足 SOC 上下限）
      x: 0.05                        # 假设值：仅 window_end_pct 使用；甘肃细则未给出 x
      anchor_penalty: 1.0e+5         # 假设值：sced_anchor软锚点罚因子（元/MWh）
    mip_rel_gap: 0.01                # 研究设定（求解参数）：MIP gap 1%
    time_limit_s: 180
  pumped:                            # 抽水蓄能：市场规则与电化学储能完全一致（rules: storage，不另设一套），依据见 docs/开发记录.md“抽水蓄能”
    rules: storage                   # 报价：发电曲线≙放电、抽水报价≙充电，段数 segments.storage_*，发电最低价>抽水最高价（storage_dis_gt_ch）
                                     # 定价：正常参与出清与定价（与储能相同，无“不可定价”固定处理）
                                     # 日前日末上库库容：报价申报 vup_end → 硬约束（≙ storage_end_soc 申报期末 SOC，川V4.0 7.7.4）；未申报回到初始上库库容
                                     # 实时：realtime.storage（value 默认；sced_anchor + two_hour_eq/hourly_eq/window_end_pct；fixed_da 执行日前）
                                     # 备用：reserve.storage_reserve；结算：两级结算（发电/抽水分列主体）
                                     # 已弃用（2026-11-01 删除）：da_mode、rt_mode(band/fixed_da/hourly_eq)、rt_band_1e4m3、pricing(fixed/band/free)、pricing_eps、reserve
    mode_step_periods: 4             # 抽蓄物理/工程简化（非市场规则，假设）：日前抽/发台数按小时决策（1 = 每 15 min），用于提速
  settlement:
    scheme: two_settlement           # 日前电量×日前 LMP + (实际−日前)×实时 LMP（甘工作方案两级结算）
    interval_min: 15                 # 假设值：统一 15 min（川结算：储能 15 min、其他 1 h；甘 15 min）
  regulation:
    enabled: false                  # 历史调频实验默认关闭；当前仅完善现货电能量市场
    research_note: "通用研究假设；首版仅认证火电与电化学储能。物理需求按MW，不乘性能K；不模拟AGC信号轨迹。"
    demand_ratio: 0.01              # 每时段预测/实际负荷的1%，研究需求假设
    mileage_ratio: 4.0              # 每15分钟预计里程/中标MW；目标与结算均不再乘dt
    response_minutes: 1.0           # 对称调频响应时间，研究假设
    sustain_h: 0.25                 # 储能最不利方向增量能量预算，研究假设
    slack_budget_tolerance: 0.00001 # 非调频松弛不超过预SCUC实际值+数值容差；拍卖/最终SCED同上界
    shortage_penalty: 100000.0      # 元/(MW·时段)，显式调频缺额惩罚；不作为结算价
    resources:                      # 独立AGC资格；capacity技术认证，offered_capacity申报上限；未列出/eligible=false不参与
      C1: {eligible: true, capacity_mw: 20, offered_capacity_mw: 20, ramp_mw_per_min: 9.7, performance: 0.8, bid_yuan_per_mw: 12.0}
      C2: {eligible: true, capacity_mw: 20, offered_capacity_mw: 20, ramp_mw_per_min: 10.9, performance: 0.8, bid_yuan_per_mw: 11.0}
      C3: {eligible: true, capacity_mw: 20, offered_capacity_mw: 20, ramp_mw_per_min: 13.0, performance: 0.8, bid_yuan_per_mw: 13.0}
      CCGT: {eligible: true, capacity_mw: 40, offered_capacity_mw: 40, ramp_mw_per_min: 27.5, performance: 1.0, bid_yuan_per_mw: 10.0}
      GT: {eligible: true, capacity_mw: 40, offered_capacity_mw: 40, ramp_mw_per_min: 27.0, performance: 1.0, bid_yuan_per_mw: 9.0}
      ES1: {eligible: true, capacity_mw: 10, offered_capacity_mw: 10, ramp_mw_per_min: 100.0, performance: 1.5, bid_yuan_per_mw: 8.0}
      ES2: {eligible: true, capacity_mw: 10, offered_capacity_mw: 10, ramp_mw_per_min: 200.0, performance: 1.5, bid_yuan_per_mw: 8.0}
      ES3: {eligible: true, capacity_mw: 10, offered_capacity_mw: 10, ramp_mw_per_min: 100.0, performance: 1.5, bid_yuan_per_mw: 8.0}
