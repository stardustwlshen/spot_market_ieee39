version: synthetic-fixed-operating-costs-v1
source_kind: research_assumption_not_observed_plant_data
source: Explicit fixed synthetic cash operating cost profile; independent of bids and offer worksheets. Initial thermal marginal assumptions are 280/297/315/405/620 CNY per MWh. Fixed online and startup parameters are copied once from original technical assumptions (startup hot fee), not read from bids at runtime.
accounting_scope: Simulated cash operating profit only; excludes capital, financing, tax, capacity payments, AGC, compensation, inventory valuation, water opportunity cost and operator constraint penalties. Charging settlement already belongs to net cash revenue.
