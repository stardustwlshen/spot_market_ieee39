# 运行配置。标“假设值”的均非规则原文数值。
date: "2026-07-15"
season: wet               # wet 丰水期 / dry 枯水期
rule_set: MKT             # 统一市场规则（config/modes.yaml，参考川/甘）
periods: 96
dt_h: 0.25
tie_line_mode: supply     # 区外来电按固定计划注入；取消此前误设的来电转负荷
load_scale: 0.68          # case39 节点负荷 × 标幺日曲线 × load_scale（研究假设；常规组合仍须全天出清验证）
seed: 20260715
forecast:
  model: multiscale_v2   # 新默认离线多尺度风光情景；旧场景缺model仍保留legacy_v1，上传列优先

# 全网研究倍率：在下方逐线因素之后乘1.2；相对上一版600MW场景增加20%，不是实际扩建结论。
line_capacity_multiplier: 1.2
# 保留历史逐线压缩/放宽因素；最终限额=原始rate×line_scale×line_capacity_multiplier。
line_scale:
  # L2-3原始500×1.2×全网1.2=720MW；不是只对这一条扩容。
  L2-3: 1.2
  L16-19: 0.6
  L2-25: 0.6
  L25-26: 0.7
  T6-31: 0.5
  T2-30: 0.7

solver:
  name: highs
  mip_rel_gap: 0.01
  time_limit_s: 600       # 加入抽蓄（PS1）后日前 MIP 更难：300 s 时 gap 约 3–5%，900 s 约 1.2%（bus 2 实测，2026-11-01）；取 600 s，未达 1% 时按时限内最优可行解出清（工程近似）
  threads: 4
  storage_binary: true    # 储能充放状态 0-1 变量 u_ch+u_dis≤1（始终开启；false 仅用于对比试验）
  highs_extra: {}         # 透传 HiGHS MIP 参数，如 presolve、mip_heuristic_effort
  # 以下为提速选项（对比见 docs/开发记录.md“求解提速”与 scripts/bench_scuc.py），默认均关闭：
  tighten: false          # 启停当段“出力+上调备用 ≤ Pmin”收紧；实测 SC 更慢（142s vs 110s）且改变备用语义
  warm_start: false       # LP 松弛→启发式启停→子 MIP 热启动；实测无收益（初始可行解质量差）
  commit_step_periods: 1  # 火电启停决策步长（时段数）；4=按小时启停，SC 约快一半但成本 +0.4%，属工程简化，仅可选
  log: false
