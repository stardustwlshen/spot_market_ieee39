name: Verify dry-day control on the same solver platform
on:
  push:
    branches: ['review/dadu19-role-replay']
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: guangdong_market/program
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-runtime.txt
      - run: python ../../.github/dadu-study-check.py baseline
