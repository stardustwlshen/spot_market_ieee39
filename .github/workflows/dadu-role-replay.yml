name: Inspect Dadu execution screenshots
on:
  push:
    branches: ['review/dadu19-role-replay']
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Read the verified browser session screenshots
        uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          run-id: 45997746640
          github-token: ${{ github.token }}
          path: evidence
      - name: Inspect desktop and mobile capture files
        run: |
          python - <<'PY'
          from base64 import b64encode
          from pathlib import Path
          for name in ['3-1440','river-1440','5-390']:
              data=b64encode((Path('evidence')/(name+'.png')).read_bytes()).decode('ascii')
              for k in range(0,len(data),8000):
                  print('DADU_FRAME',name,k,data[k:k+8000])
          PY
