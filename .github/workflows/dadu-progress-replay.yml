name: Read operative provisions in the verified V5.0 draft
on:
  push:
    branches: ['review/dadu19-basin-progress']
permissions:
  contents: read
jobs:
  clauses:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install -q pymupdf
          curl --fail --location --max-time 40 --retry 1 'https://mfs.mysteelcdn.com/group1/M00/7A/DB/rBL64GrqyT-AcGDEACBH_hBshK8829.pdf' -o /tmp/consult.pdf
          python .github/dadu-draft-probe.py /tmp/consult.pdf
