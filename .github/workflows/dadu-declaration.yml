name: Verify coupled declaration workspace
on:
  push:
    branches: ['review/dadu19-basin-progress']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guangdong_market/program
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements-runtime.txt pytest
      - run: python -m pytest -qx tests/test_sichuan_v5_dadu_declaration.py
